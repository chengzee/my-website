<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="吉米與他的貓貓小窩 - 用照片和文字記錄生活的個人網站" />
  <title>吉米與他的貓貓小窩</title>
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-hero">

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <h1 class="site-title"><a href="homepage.html">吉米與他的貓貓小窩</a></h1>
      <nav class="main-nav">
        <a href="homepage.html">首頁</a>
        <a href="photo-gallery.html">相片集</a>
        <a href="articles.html">文章</a>
        <a href="about.html">關於</a>
      </nav>
      <button class="nav-toggle" aria-label="選單">☰</button>
    </div>
  </header>

  <!-- Hero 輪播 -->
  <section class="hero">
    <div class="slider">
      <div class="slides" id="slides"></div>
      <div class="slider-nav" id="slider-nav"></div>
    </div>
  </section>

  <section class="hero-caption">
    <a class="button-link" href="photo-gallery.html">前往相片集 →</a>
  </section>

  <!-- 近期文章 -->
  <section class="section">
    <h2>近期文章</h2>
    <div class="cards">
      <div class="card">
        <img src="photos/IMG_0807.JPG" alt="波波">
        <div class="card-body">
          <h3>世上只有波波好</h3>
          <p>天使的臉孔、魔鬼的身材...</p>
        </div>
      </div>
      <!-- 可繼續新增更多卡片 -->
    </div>
    <a class="button-link" href="articles.html">前往文章列表 →</a>
  </section>

  <!-- 近期相簿 / 影片 -->
  <section class="section">
    <h2>近期相簿 / 影片</h2>
    <div class="cards">
      <div class="card">
        <img src="photos/IMG_0762.JPG" alt="米米">
        <div class="card-body">
          <h3>你也想被米米眼神魅惑嗎？</h3>
          <p>歡慶米米 - 2024/05 生日</p>
        </div>
      </div>
      <div class="card">
        <img src="photos/IMG_1750.jpg" alt="豆豆">
        <div class="card-body">
          <h3>我再睡一下...</h3>
          <p>歡慶豆豆 - 2024/05 生日</p>
        </div>
      </div>
      <!-- 可繼續新增更多卡片 -->
    </div>
    <a class="button-link" href="photo-gallery.html">前往影音列表 →</a>
  </section>

  <!-- Footer -->
  <footer class="site-footer">
    <p>&copy; 2025 吉米與他的貓貓小窩</p>
    <p>ig：<a href="https://instagram.com/czhuang" target="_blank" rel="noopener">czhuang</a></p>
  </footer>

  <!-- Scripts -->
  <script src="js/common.js"></script>
  <script>
    // === Hero 無限輪播 ===
    const slidesContainer = document.getElementById('slides');
    const navContainer = document.getElementById('slider-nav');
    let slides = [];
    let currentIndex = 1;
    let autoplayInterval;

    fetch('photo-list.json')
      .then(res => res.json())
      .then(data => {
        if (data.length === 0) return;
        slides = data.slice(0, 6);

        // 無限循環：前後各加一個 clone
        const firstClone = { filename: slides[0].filename };
        const lastClone  = { filename: slides[slides.length - 1].filename };
        const allSlides  = [lastClone, ...slides, firstClone];

        allSlides.forEach(item => {
          const slide = document.createElement('div');
          slide.classList.add('slide-item');
          const img = document.createElement('img');
          img.src = item.filename;
          img.alt = '近期相片';
          img.loading = 'lazy';
          slide.appendChild(img);
          slidesContainer.appendChild(slide);
        });

        // 導覽圓點
        for (let i = 0; i < slides.length; i++) {
          const btn = document.createElement('button');
          btn.setAttribute('aria-label', `第 ${i + 1} 張`);
          btn.addEventListener('click', () => {
            stopAutoplay();
            goToSlide(i + 1);
            startAutoplay();
          });
          navContainer.appendChild(btn);
        }

        slidesContainer.style.transform = `translateX(-${currentIndex * 100}vw)`;
        updateNav();
        startAutoplay();
      });

    function goToSlide(index) {
      slidesContainer.style.transition = 'transform 1.2s ease-in-out';
      currentIndex = index;
      slidesContainer.style.transform = `translateX(-${currentIndex * 100}vw)`;
      updateNav();
    }

    function startAutoplay() {
      autoplayInterval = setInterval(() => {
        goToSlide(currentIndex + 1);
      }, 4000);
    }

    function stopAutoplay() {
      clearInterval(autoplayInterval);
    }

    // 無限循環：到達 clone 時瞬間跳回
    slidesContainer?.addEventListener('transitionend', () => {
      const childrenCount = slidesContainer.children.length;
      if (currentIndex === childrenCount - 1) {
        slidesContainer.style.transition = 'none';
        currentIndex = 1;
        slidesContainer.style.transform = `translateX(-${currentIndex * 100}vw)`;
      } else if (currentIndex === 0) {
        slidesContainer.style.transition = 'none';
        currentIndex = slidesContainer.children.length - 2;
        slidesContainer.style.transform = `translateX(-${currentIndex * 100}vw)`;
      }
    });

    function updateNav() {
      const buttons = document.querySelectorAll('#slider-nav button');
      buttons.forEach((btn, i) => {
        btn.classList.toggle('active', i === currentIndex - 1);
      });
    }
  </script>

</body>
</html>
