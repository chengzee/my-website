<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="吉米與他的貓貓小窩 - 用照片和文字記錄生活的個人網站" />
  <meta property="og:title" content="吉米與他的貓貓小窩" />
  <meta property="og:description" content="用照片和文字記錄生活的個人網站，認識我們的四隻貓貓：波波、米米、豆豆、小寶寶" />
  <meta property="og:image" content="photos/_hero/IMG_0766.jpg" />
  <meta property="og:type" content="website" />
  <title>吉米與他的貓貓小窩</title>
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-hero">

  <div id="site-header"></div>

  <!-- Hero 輪播 -->
  <section class="hero">
    <div class="slider">
      <div class="slides" id="slides"></div>
      <div class="slider-nav" id="slider-nav"></div>
    </div>
  </section>

  <section class="hero-caption">
    <a class="button-link" href="photo-gallery.html">前往相片集 →</a>
  </section>

  <main>

  <!-- 貓咪專區 -->
  <section class="section">
    <h2>我們的貓咪</h2>
    <div class="cards">
      <a href="cats.html#bobo" class="card">
        <img src="photos/_cards/bobo.jpg" alt="波波">
        <div class="card-body">
          <h3>世上只有波波好</h3>
          <p>天使的臉孔、魔鬼的身材...</p>
        </div>
      </a>
    </div>
    <a class="button-link" href="cats.html">查看所有貓咪 →</a>
  </section>

  <!-- 近期相簿 / 影片 -->
  <section class="section">
    <h2>近期相簿 / 影片</h2>
    <div class="cards">
      <a href="photo-gallery.html?cat=%E7%B1%B3%E7%B1%B3" class="card">
        <img src="photos/_cards/mimi.jpg" alt="米米">
        <div class="card-body">
          <h3>你也想被米米眼神魅惑嗎？</h3>
          <p>歡慶米米 - 2024/05 生日</p>
        </div>
      </a>
      <a href="photo-gallery.html?cat=%E8%B1%86%E8%B1%86" class="card">
        <img src="photos/_cards/doudou.jpg" alt="豆豆">
        <div class="card-body">
          <h3>我再睡一下...</h3>
          <p>歡慶豆豆 - 2024/05 生日</p>
        </div>
      </a>
    </div>
    <a class="button-link" href="photo-gallery.html">前往影音列表 →</a>
  </section>
  </main>

  <div id="site-footer"></div>

  <!-- Scripts -->
  <script src="js/components.js"></script>
  <script src="js/common.js"></script>
  <script>
    // === Hero 無限輪播 ===
    const slidesContainer = document.getElementById('slides');
    const navContainer = document.getElementById('slider-nav');
    let currentIndex = 1;
    let autoplayInterval;

    // 精選 Hero 照片（1920px 高品質，依亮度分析挑選最明亮的照片）
    const heroPhotos = [
      'photos/_hero/IMG_0766.jpg',  // 豆豆 - brightness 192
      'photos/_hero/IMG_0785.jpg',  // 豆豆 - brightness 182
      'photos/_hero/IMG_1575.jpg',  // 小寶寶 - brightness 132
      'photos/_hero/IMG_0784.jpg',  // 米米 - brightness 130
      'photos/_hero/IMG_1478.jpg',  // 波波 - brightness 128
      'photos/_hero/IMG_0744.jpg',  // 豆豆 - brightness 178
    ];

    // 無限循環：前後各加一個 clone
    const firstClone = heroPhotos[0];
    const lastClone  = heroPhotos[heroPhotos.length - 1];
    const allSlides  = [lastClone, ...heroPhotos, firstClone];

    allSlides.forEach((src, i) => {
      const slide = document.createElement('div');
      slide.classList.add('slide-item');
      const img = document.createElement('img');
      img.src = src;
      img.alt = '近期相片';
      // 首張可見的圖片（index 1）用 eager，其餘 lazy
      img.loading = (i <= 2) ? 'eager' : 'lazy';
      slide.appendChild(img);
      slidesContainer.appendChild(slide);
    });

    // 導覽圓點
    for (let i = 0; i < heroPhotos.length; i++) {
      const btn = document.createElement('button');
      btn.setAttribute('aria-label', `第 ${i + 1} 張`);
      btn.addEventListener('click', () => {
        stopAutoplay();
        goToSlide(i + 1);
        startAutoplay();
      });
      navContainer.appendChild(btn);
    }

    slidesContainer.style.transform = `translateX(-${currentIndex * 100}vw)`;
    updateNav();
    startAutoplay();

    function goToSlide(index) {
      slidesContainer.style.transition = 'transform 1.2s ease-in-out';
      currentIndex = index;
      slidesContainer.style.transform = `translateX(-${currentIndex * 100}vw)`;
      updateNav();
    }

    function startAutoplay() {
      autoplayInterval = setInterval(() => {
        goToSlide(currentIndex + 1);
      }, 4000);
    }

    function stopAutoplay() {
      clearInterval(autoplayInterval);
    }

    // 無限循環：到達 clone 時瞬間跳回
    slidesContainer?.addEventListener('transitionend', () => {
      const childrenCount = slidesContainer.children.length;
      if (currentIndex === childrenCount - 1) {
        slidesContainer.style.transition = 'none';
        currentIndex = 1;
        slidesContainer.style.transform = `translateX(-${currentIndex * 100}vw)`;
      } else if (currentIndex === 0) {
        slidesContainer.style.transition = 'none';
        currentIndex = slidesContainer.children.length - 2;
        slidesContainer.style.transform = `translateX(-${currentIndex * 100}vw)`;
      }
    });

    function updateNav() {
      const buttons = document.querySelectorAll('#slider-nav button');
      buttons.forEach((btn, i) => {
        btn.classList.toggle('active', i === currentIndex - 1);
      });
    }

    // === 觸控滑動支援 ===
    let touchStartX = 0;
    let touchEndX = 0;
    const heroEl = document.querySelector('.hero');

    // hover 時暫停輪播
    heroEl.addEventListener('mouseenter', stopAutoplay);
    heroEl.addEventListener('mouseleave', startAutoplay);

    heroEl.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    heroEl.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      const diff = touchStartX - touchEndX;
      if (Math.abs(diff) > 50) {
        stopAutoplay();
        goToSlide(currentIndex + (diff > 0 ? 1 : -1));
        startAutoplay();
      }
    });
  </script>

</body>
</html>
