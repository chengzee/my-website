<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="吉米與他的貓貓小窩 - 貓咪飲食日記" />
  <meta property="og:title" content="飲食日記 - 吉米與他的貓貓小窩" />
  <meta property="og:description" content="記錄貓咪們的每日飲食，追蹤健康狀況" />
  <meta property="og:type" content="website" />
  <title>飲食日記 - 吉米與他的貓貓小窩</title>
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/vendor/chart.umd.min.js"></script>
</head>
<body>

  <div id="site-header"></div>

  <!-- Main Content -->
  <main class="section page-section">
    <div class="diary-title-bar">
      <h2>🍽 飲食日記</h2>
      <div id="admin-bar">
        <button class="btn-admin-login" id="btn-login" onclick="adminLogin()">🔐 管理員登入</button>
        <div class="admin-status" id="admin-status" style="display:none;">
          <span>✅ 管理模式</span>
          <button class="btn-admin-logout" onclick="adminLogout()">登出</button>
        </div>
      </div>
    </div>

    <!-- 新增紀錄表單（管理員限定） -->
    <div class="diary-form-card admin-only">
      <h3>📝 新增紀錄</h3>
      <form id="diary-form" class="diary-form">
        <div class="form-row">
          <div class="form-group">
            <label for="record-date">日期</label>
            <input type="date" id="record-date" required />
          </div>
          <div class="form-group">
            <label for="record-time">時間</label>
            <input type="time" id="record-time" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="record-cat">貓咪</label>
            <select id="record-cat" required>
              <option value="">選擇貓咪</option>
              <option value="波波">🐱 波波</option>
              <option value="米米">🐱 米米</option>
              <option value="豆豆">🐱 豆豆</option>
              <option value="小寶寶">🐱 小寶寶</option>
            </select>
          </div>
          <div class="form-group">
            <label for="record-type">類型</label>
            <select id="record-type" required>
              <option value="">選擇類型</option>
              <option value="乾糧">🥣 乾糧</option>
              <option value="濕食">🥫 濕食</option>
              <option value="零食">🍬 零食</option>
              <option value="水">💧 喝水</option>
              <option value="其他">📌 其他</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="record-food">食物名稱</label>
            <input type="text" id="record-food" placeholder="例：皇家 K36" />
          </div>
          <div class="form-group">
            <label for="record-amount">份量 (g)</label>
            <input type="number" id="record-amount" placeholder="例：30" min="0" />
          </div>
        </div>
        <div class="form-group" style="width:100%;">
          <label for="record-note">備註</label>
          <input type="text" id="record-note" placeholder="例：吃很快、剩一半..." />
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">✅ 新增紀錄</button>
        </div>
      </form>
    </div>

    <!-- 篩選與統計 -->
    <div class="diary-controls">
      <div class="filter-group">
        <label>篩選貓咪：</label>
        <select id="filter-cat">
          <option value="all">全部</option>
          <option value="波波">波波</option>
          <option value="米米">米米</option>
          <option value="豆豆">豆豆</option>
          <option value="小寶寶">小寶寶</option>
        </select>
      </div>
      <div class="filter-group">
        <label>篩選類型：</label>
        <select id="filter-type">
          <option value="all">全部</option>
          <option value="乾糧">乾糧</option>
          <option value="濕食">濕食</option>
          <option value="零食">零食</option>
          <option value="水">喝水</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="data-actions admin-only">
        <button class="btn-secondary" id="btn-export" title="匯出資料">📤 匯出</button>
        <button class="btn-secondary" id="btn-import" title="匯入資料">📥 匯入</button>
        <input type="file" id="import-file" accept=".json" style="display:none;" />
      </div>
    </div>

    <!-- 今日摘要 -->
    <div class="diary-summary" id="diary-summary">
      <!-- JS 動態產生 -->
    </div>

    <!-- 圖表 -->
    <div class="diary-chart-container">
      <h3>📊 近 7 天飲食統計</h3>
      <canvas id="diary-chart" height="250"></canvas>
    </div>

    <!-- 紀錄表格 -->
    <div class="diary-table-container">
      <h3>📋 紀錄列表</h3>
      <div class="table-scroll">
        <table class="diary-table" id="diary-table">
          <thead>
            <tr>
              <th>日期</th>
              <th>時間</th>
              <th>貓咪</th>
              <th>類型</th>
              <th>食物</th>
              <th>份量</th>
              <th>備註</th>
              <th class="admin-only-cell">操作</th>
            </tr>
          </thead>
          <tbody id="diary-tbody">
          </tbody>
        </table>
      </div>
      <p class="empty-message" id="empty-msg" style="display:none;">目前沒有飲食紀錄 🐱</p>
    </div>

  </main>

  <div id="site-footer"></div>

  <script src="js/components.js"></script>
  <script src="js/common.js"></script>
  <script src="js/diary.js"></script>
</body>
</html>
