<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="吉米與他的貓貓小窩 - 相片集" />
  <title>相片集 - 吉米與他的貓貓小窩</title>
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <h1 class="site-title"><a href="homepage.html">吉米與他的貓貓小窩</a></h1>
      <nav class="main-nav">
        <a href="homepage.html">首頁</a>
        <a href="photo-gallery.html">相片集</a>
        <a href="cats.html">貓咪</a>
        <a href="cat-diary.html">飲食日記</a>
        <a href="articles.html">文章</a>
        <a href="about.html">關於</a>
      </nav>
      <button class="nav-toggle" aria-label="選單">☰</button>
    </div>
  </header>

  <!-- Category Filter -->
  <section style="max-width:1200px;margin:80px auto 0;padding:1rem 1.5rem 0;">
    <div class="gallery-filter" id="filterBar">
      <button class="filter-btn active" data-cat="all">全部</button>
      <button class="filter-btn" data-cat="波波">🐱 波波</button>
      <button class="filter-btn" data-cat="米米">🐱 米米</button>
      <button class="filter-btn" data-cat="豆豆">🐱 豆豆</button>
      <button class="filter-btn" data-cat="小寶寶">🐱 小寶寶</button>
    </div>
    <p class="gallery-count" id="galleryCount"></p>
  </section>

  <!-- Gallery -->
  <div class="gallery" id="gallery"></div>

  <!-- Pagination -->
  <div class="pagination" id="pagination"></div>

  <!-- Lightbox -->
  <div class="lightbox-overlay" id="lightbox">
    <span class="lightbox-close" id="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="放大檢視" />
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <p>&copy; 2026 吉米與他的貓貓小窩</p>
    <p><a href="https://instagram.com/cheng_zee" target="_blank" rel="noopener" class="ig-link"><svg class="ig-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg> cheng_zee</a></p>
  </footer>

  <!-- Scripts -->
  <script src="js/common.js"></script>
  <script>
    const IMAGES_PER_PAGE = 50;
    const gallery = document.getElementById('gallery');
    const pagination = document.getElementById('pagination');
    const galleryCount = document.getElementById('galleryCount');

    let allData = [];
    let filteredData = [];
    let currentCat = 'all';

    // 取得 ?page= 參數
    function getPage() {
      const params = new URLSearchParams(window.location.search);
      return parseInt(params.get('page')) || 1;
    }

    // 篩選按鈕
    document.getElementById('filterBar').addEventListener('click', function(e) {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCat = btn.dataset.cat;
      applyFilter();
      renderPage(1);
      // 更新 URL 不重載
      history.replaceState(null, '', '?page=1' + (currentCat !== 'all' ? '&cat=' + encodeURIComponent(currentCat) : ''));
    });

    function applyFilter() {
      if (currentCat === 'all') {
        // 「全部」分類時，依檔名去重（避免同一張照片在多個分類目錄中重複出現）
        var seen = {};
        filteredData = [];
        allData.forEach(function(item) {
          if (item.type !== 'image') return;
          var basename = item.filename.split('/').pop();
          if (!seen[basename]) {
            seen[basename] = true;
            filteredData.push(item);
          }
        });
      } else {
        filteredData = allData.filter(item => item.category === currentCat && item.type === 'image');
      }
    }

    function renderPage(page) {
      gallery.innerHTML = '';
      pagination.innerHTML = '';

      const totalImages = filteredData.length;
      const totalPages = Math.ceil(totalImages / IMAGES_PER_PAGE);

      if (page < 1) page = 1;
      if (page > totalPages) page = totalPages;
      if (totalPages === 0) page = 0;

      galleryCount.textContent = '共 ' + totalImages + ' 張照片' +
        (currentCat !== 'all' ? '（' + currentCat + '）' : '');

      if (totalImages === 0) {
        gallery.innerHTML = '<p style="text-align:center;padding:2rem;color:#999;grid-column:1/-1;">此分類暫無照片</p>';
        return;
      }

      const startIndex = (page - 1) * IMAGES_PER_PAGE;
      const endIndex = startIndex + IMAGES_PER_PAGE;
      const imagesToShow = filteredData.slice(startIndex, endIndex);

      // 顯示圖片
      imagesToShow.forEach(item => {
        const img = document.createElement('img');
        // 使用縮圖加快載入，沒有縮圖則用原圖
        img.src = item.thumbnail || item.filename;
        img.alt = item.category || 'photo';
        img.loading = 'lazy';
        img.addEventListener('click', function() { openLightbox(item.filename); });
        gallery.appendChild(img);
      });

      // 分頁按鈕
      if (totalPages > 1) {
        if (page > 1) {
          const prev = document.createElement('a');
          prev.href = '#';
          prev.textContent = '← 上一頁';
          prev.addEventListener('click', function(e) { e.preventDefault(); renderPage(page - 1); });
          pagination.appendChild(prev);
        }

        const info = document.createElement('span');
        info.textContent = ' 第 ' + page + ' / ' + totalPages + ' 頁 ';
        info.style.cssText = 'display:flex;align-items:center;color:#666;font-size:0.9rem;';
        pagination.appendChild(info);

        if (page < totalPages) {
          const next = document.createElement('a');
          next.href = '#';
          next.textContent = '下一頁 →';
          next.addEventListener('click', function(e) { e.preventDefault(); renderPage(page + 1); });
          pagination.appendChild(next);
        }
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 初始化
    fetch('photo-list.json')
      .then(function(response) { return response.json(); })
      .then(function(data) {
        allData = data;
        // 讀取 URL 的 cat 參數
        var params = new URLSearchParams(window.location.search);
        var urlCat = params.get('cat');
        if (urlCat) {
          currentCat = urlCat;
          document.querySelectorAll('.filter-btn').forEach(function(b) {
            b.classList.toggle('active', b.dataset.cat === urlCat);
          });
        }
        applyFilter();
        renderPage(getPage());
      })
      .catch(function(error) {
        console.error('讀取 JSON 發生錯誤:', error);
        gallery.innerHTML = '<p style="text-align:center;padding:2rem;color:#999;">抱歉，無法載入相片清單。</p>';
      });

    // === Lightbox 功能 ===
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxClose = document.getElementById('lightbox-close');

    function openLightbox(src) {
      lightboxImg.src = src;
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      lightboxImg.src = '';
      document.body.style.overflow = '';
    }

    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    // ESC 鍵關閉
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>

</body>
</html>
