<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="吉米與他的貓貓小窩 - 相片集" />
  <title>相片集 - 吉米與他的貓貓小窩</title>
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <h1 class="site-title"><a href="homepage.html">吉米與他的貓貓小窩</a></h1>
      <nav class="main-nav">
        <a href="homepage.html">首頁</a>
        <a href="photo-gallery.html">相片集</a>
        <a href="articles.html">文章</a>
        <a href="about.html">關於</a>
      </nav>
      <button class="nav-toggle" aria-label="選單">☰</button>
    </div>
  </header>

  <!-- Gallery -->
  <div class="gallery" id="gallery"></div>

  <!-- Pagination -->
  <div class="pagination" id="pagination"></div>

  <!-- Lightbox -->
  <div class="lightbox-overlay" id="lightbox">
    <span class="lightbox-close" id="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="放大檢視" />
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <p>&copy; 2025 吉米與他的貓貓小窩</p>
    <p>ig：<a href="https://instagram.com/czhuang" target="_blank" rel="noopener">czhuang</a></p>
  </footer>

  <!-- Scripts -->
  <script src="js/common.js"></script>
  <script>
    const IMAGES_PER_PAGE = 50;
    const gallery = document.getElementById('gallery');
    const pagination = document.getElementById('pagination');

    // 取得 ?page= 參數
    const params = new URLSearchParams(window.location.search);
    let page = parseInt(params.get('page')) || 1;

    fetch('photo-list.json')
      .then(response => response.json())
      .then(data => {
        const totalImages = data.length;
        const totalPages = Math.ceil(totalImages / IMAGES_PER_PAGE);

        if (page < 1) page = 1;
        if (page > totalPages) page = totalPages;

        const startIndex = (page - 1) * IMAGES_PER_PAGE;
        const endIndex = startIndex + IMAGES_PER_PAGE;
        const imagesToShow = data.slice(startIndex, endIndex);

        // 顯示圖片
        imagesToShow.forEach(item => {
          const img = document.createElement('img');
          img.src = item.filename;
          img.alt = 'photo';
          img.loading = 'lazy';
          // 點擊開啟 Lightbox
          img.addEventListener('click', () => openLightbox(item.filename));
          gallery.appendChild(img);
        });

        // 建立分頁按鈕
        if (totalPages > 1) {
          if (page > 1) {
            const prev = document.createElement('a');
            prev.href = `?page=${page - 1}`;
            prev.textContent = '← 上一頁';
            pagination.appendChild(prev);
          }

          // 頁碼資訊
          const info = document.createElement('span');
          info.textContent = ` 第 ${page} / ${totalPages} 頁 `;
          info.style.cssText = 'display:flex;align-items:center;color:#666;font-size:0.9rem;';
          pagination.appendChild(info);

          if (page < totalPages) {
            const next = document.createElement('a');
            next.href = `?page=${page + 1}`;
            next.textContent = '下一頁 →';
            pagination.appendChild(next);
          }
        }
      })
      .catch(error => {
        console.error('讀取 JSON 發生錯誤:', error);
        gallery.innerHTML = '<p style="text-align:center;padding:2rem;color:#999;">抱歉，無法載入相片清單。</p>';
      });

    // === Lightbox 功能 ===
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxClose = document.getElementById('lightbox-close');

    function openLightbox(src) {
      lightboxImg.src = src;
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      lightboxImg.src = '';
      document.body.style.overflow = '';
    }

    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    // ESC 鍵關閉
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>

</body>
</html>
